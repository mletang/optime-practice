accent);color:var(--ink)}.accent:hover:not(:disabled){background:#c2e477}main{max-width:1144px;margin:40px auto 70px;padding:0 28px;outline:none}footer{max-width:1100px;margin:25px auto;padding:22px 28px 40px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.17em;text-transform:uppercase}.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:45px;align-items:center;margin-bottom:36px}.hero p{font-size:17px;max-width:570px;color:var(--muted)}.hero-art{background:var(--dark);color:#eef5de;border-radius:var(--radius);padding:32px;position:relative;overflow:hidden;min-height:224px}.hero-art:after{content:'';width:220px;height:220px;border:1px solid #477069;border-radius:50%;position:absolute;right:-70px;top:-100px;box-shadow:0 0 0 25px #214944,0 0 0 26px #477069,0 0 0 53px #214944}.hero-art .large{font-family:Manrope;font-size:58px;line-height:1.2;letter-spacing:-.06em;color:var(--accent)}.hero-art p{color:#c5d6c9;font-size:13px;margin:12px 0 0;max-width:220px;position:relative;z-index:1}.mini-stats{display:flex;gap:25px;margin-top:22px;font-size:12px}.mini-stats strong{font-size:19px;display:block}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(250px,1fr);gap:24px}.card{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:28px}.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:22px}.card-top h2{font-size:23px;margin:0}.step{font-size:11px;letter-spacing:.15em;color:var(--muted)}.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode{position:relative;display:block;border:1px solid var(--line);border-radius:15px;padding:17px;cursor:pointer}.mode:has(input:checked){border:2px solid #397561;background:#f1f8e8;padding:16px}.mode input{position:absolute;right:13px;top:15px;accent-color:var(--dark)}.mode strong{display:block;margin-bottom:7px;padding-right:15px}.mode small{display:block;font-size:12px q-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:24px;font-size:11px;color:var(--muted)}.pill{background:#eef2e6;border-radius:30px;padding:5px 10px;font-weight:700;color:var(--ink)}.question-card h2{font-size:24px;line-height:1.45;letter-spacing:-.025em}.choice-hint{font-size:12px;color:var(--muted);margin:0 0 18px}.options{display:grid;gap:11px;margin-bottom:20px}.option{display:flex;gap:13px;padding:15px;border:1px solid var(--line);border-radius:12px;align-items:center;cursor:pointer;min-height:64px}.option:has(input:checked){border-color:#3e806c;background:#eef5e7;box-shadow:inset 0 0 0 1px #3e806c}.option input{accent-color:#246652;width:19px;height:19px;flex-shrink:0}.letter{width:25px;height:25px;display:grid;place-items:center;font-size:11px;border:1px solid #d3dcd0;border-radius:6px;flex-shrink:0}.option-text{font-size:14px}.option.correct{border-color:#28805a;background:#edf7eb}.option.wrong{border-color:#c7675e;background:#fff2ed}.q-actions{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:20px;margin-top:24px}.actions{display:flex;gap:10px;flex-wrap:wrap}.feedback{padding:21px;border-radius:15px;background:#f0f5e8;margin:20px 0}.feedback.wrong{background:#fff4ec}.feedback h3{font-size:18px}.feedback p{font-size:14px;margin-bottom:12px}.source{font-size:11px;color:#596b60;display:block;border-top:1px solid #cdd8c7;padding-top:10px}.navigator h3{font-size:16px}.nav-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:18px 0}.nav-grid button{padding:0;min-height:36px;border-radius:7px;background:#f0f2ec;color:var(--ink);font-size:12px;border:1px solid transparent;position:relative}.nav-grid button.answered{background:#cde4b3}.nav-grid button.current{border:2px solid var(--ink)}.nav-grid button.flagged:after{content:'';position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:#c48c29}.legend{font-size:10px;color:var(--mut <body><a class="skip" href="#main">Skip to content</a><header class="site-header"><a class="brand" href="#" id="brand"><span class="brand-icon" aria-hidden="true">✳</span><span>OpTime<span class="brand-sub">PRACTICE STUDIO</span></span></a><span class="edition">FEB 2026 EDITION</span><button class="ghost" id="home-btn">Study home</button></header><main id="main" tabindex="-1"></main><footer>Independent practice resource · Original questions, not official exam items.<br>Based on your February 2026 course guides. Progress stays in this browser.</footer><dialog id="confirm"><h2>Finish this session?</h2><p id="confirm-text"></p><div class="actions"><button class="secondary" id="keep-working">Keep working</button><button id="finish-now">Submit answers</button></div></dialog><div id="toast" role="status" aria-live="polite"></div><script>/* Original practice questions; source references are PDF page numbers. */
window.QUESTION_BANK = [
  {
    "id": "OR100-01",
    "course": "OR100",
    "topic": "Case and log",
    "pages": [
      17,
      22
    ],
    "prompt": "A procedure has finished. Which record should describe what actually happened in the operating room?",
    "options": [
      "The surgical case",
      "The surgical log",
      "The surgeon preference list",
      "The scheduling block"
    ],
    "correct": [
      1
    ],
    "rationale": "The log records the actual surgical event; the case is the plan. Preference lists organize orders and blocks reserve scheduling time."
  },
  {
    "id": "OR100-02",
    "course": "OR100",
    "topic": "Case and log",
    "pages": [
      22
    ],
    "prompt": "After a log has been created, a planner changes the surgical case. What is the safe expectation?",
    "options": [
      "The log automatically receives every change",
      "The log must be reviewed separately; case changes do not automatically copy forward",
      "Posting is required to synchronize the two",
      "The case becomes the record of actual care"
    ],
    "correct": [
      1
    ],
    "rationale": "Once the log exists, later case changes do not automatically update it. Posting concerns charges and log closure, not synchronization."
  },
  {
    "id": "OR100-03",
    "course": "OR100",
    "topic": "Case entry",
    "pages": [
      30,
      40
    ],
    "prompt": "Which set contains only the five programmatically required case details?",
    "options": [
      "Patient, date, surgeon, anesthesia type, location",
      "Patient, location, service, procedure, surgeon",
      "Patient, equipment, date, procedure, service",
      "Surgeon, laterality, patient class, date, location"
    ],
    "correct": [
      1
    ],
    "rationale": "Patient, location, service, procedure, and surgeon are the five required items. Other details may be important or locally required but are not this five-item set."
  },
  {
    "id": "OR100-04",
    "course": "OR100",
    "topic": "Scheduling",
    "pages": [
      48,
      63
    ],
    "prompt": "A scheduler needs to locate cases that have not yet been placed on the schedule. Where should they begin?",
    "options": [
      "Post Charges",
      "Depot",
      "LDA Avatar",
      "Chart Review"
    ],
    "correct": [
      1
    ],
    "rationale": "The Depot holds unscheduled cases. Post Charges supports charge posting; the other activities do not serve as the unscheduled-case queue."
  },
  {
    "id": "OR100-05",
    "course": "OR100",
    "topic": "Scheduling",
    "pages": [
      51,
      63
    ],
    "prompt": "A patient decides not to undergo a correctly created planned procedure. Which action fits this situation?",
    "options": [
      "Void the case as an entry error",
      "Cancel the case",
      "Shuffle the case",
      "Swap it with another case"
    ],
    "correct": [
      1
    ],
    "rationale": "Cancel is appropriate when the planned procedure will not happen. Void is for a case created in error; shuffle and swap rearrange scheduling."
  },
  {
    "id": "OR100-06",
    "course": "OR100",
    "topic": "Scheduling",
    "pages": [
      63
    ],
    "prompt": "A duplicate case was accidentally created. Which action best represents the error?",
    "options": [
      "Cancel the intended procedure",
      "Trigger its charges",
      "Void the duplicate case",
      "Post the duplicate log"
    ],
    "correct": [
      2
    ],
    "rationale": "Void identifies a case created in error. Cancel refers to a planned procedure that will not occur; charge actions do not correct duplicate case entry."
  },
  {
    "id": "OR100-07",
    "course": "OR100",
    "topic": "Orders",
    "pages": [
      41,
      84
    ],
    "prompt": "An authorized order is held for a later phase. What makes that Signed & Held order active?",
    "options": [
      "Adding a preference card",
      "Releasing the order",
      "Posting the log",
      "Creating a scheduling block"
    ],
    "correct": [
      1
    ],
    "rationale": "Releasing a Signed & Held order makes it active. Cards, blocks, and posting do not replace release."
  },
  {
    "id": "OR100-08",
    "course": "OR100",
    "topic": "Orders",
    "pages": [
      41
    ],
    "prompt": "Which factors does the course identify for assigning the default signing action to an order? Select all that apply.",
    "options": [
      "The intended phase of care",
      "The patient location",
      "The number of preference cards",
      "The inventory manufacturer"
    ],
    "correct": [
      0,
      1
    ],
    "rationale": "The system uses phase of care and patient location to determine whether an order is for now or later. Card count and manufacturer do not drive this decision."
  },
  {
    "id": "OR100-09",
    "course": "OR100",
    "topic": "Navigators",
    "pages": [
      83,
      84
    ],
    "prompt": "Before leaving a perioperative phase, a nurse wants to confirm required documentation is complete. Which navigator section is the best fit?",
    "options": [
      "Verify",
      "Case Request",
      "Calendar",
      "Resource Sidebar"
    ],
    "correct": [
      0
    ],
    "rationale": "Verify supports confirmation of required documentation. The scheduling and case-request tools serve different workflows."
  },
  {
    "id": "OR100-10",
    "course": "OR100",
    "topic": "Procedure Pass",
    "pages": [
      71,
      83
    ],
    "prompt": "A nurse wants to focus on pre-surgical tasks assigned to their role. Which approach is most direct?",
    "options": [
      "Use the Tasks section grouped by role",
      "Post the log to filter the tasks",
      "Remove the case from the schedule",
      "Open a surgeon preference list"
    ],
    "correct": [
      0
    ],
    "rationale": "Procedure Pass tasks can be grouped by role. Posting, unscheduling, and order preference lists do not provide that task view."
  },
  {
    "id": "OR100-11",
    "course": "OR100",
    "topic": "Preference tools",
    "pages": [
      40,
      49,
      114
    ],
    "prompt": "A surgeon wants to place several related orders together during one ordering session. Which tool fits?",
    "options": [
      "Order set",
      "Preference card",
      "OR block",
      "Surgical log"
    ],
    "correct": [
      0
    ],
    "rationale": "An order set groups related orders for ordering. A preference card configures surgical preferences; a block reserves time; a log records actual surgery."
  },
  {
    "id": "OR100-12",
    "course": "OR100",
    "topic": "Inventory",
    "pages": [
      104,
      105
    ],
    "prompt": "Which items belong to the pick-list content described in the course? Select all that apply.",
    "options": [
      "Medications",
      "Supplies",
      "Named circulating nurses",
      "Individually assigned equipment"
    ],
    "correct": [
      0,
      1
    ],
    "rationale": "Pick lists contain medication and inventory needs. Staff and equipment assignments are resource concepts, not those pick-list contents."
  },
  {
    "id": "OR100-13",
    "course": "OR100",
    "topic": "Inventory",
    "pages": [
      105
    ],
    "prompt": "Compared with supply documentation, what additional information is characteristic of implant tracking?",
    "options": [
      "Only the number of scheduled cases",
      "Implant action, serial number, and expiration date",
      "Only the surgeon login password",
      "Only the scheduling block owner"
    ],
    "correct": [
      1
    ],
    "rationale": "Implants require additional tracking such as action, serial number, and expiration date. Both supplies and implants can also require used and wasted quantities."
  },
  {
    "id": "OR100-14",
    "course": "OR100",
    "topic": "Flowsheets",
    "pages": [
      122,
      123
    ],
    "prompt": "A nurse sees device values waiting to be filed. Why should those values be validated?",
    "options": [
      "To review accuracy before filing to the chart",
      "To automatically post the surgical log",
      "To create a new preference card",
      "To change the patient service"
    ],
    "correct": [
      0
    ],
    "rationale": "Validation lets the clinician review device values before they enter the chart and avoids filing unnecessary data. It is not a charge-posting or scheduling function."
  },
  {
    "id": "OR100-15",
    "course": "OR100",
    "topic": "Charging",
    "pages": [
      135,
      136
    ],
    "prompt": "Some charges are ready, but further documentation is expected. Which action can send ready charges while leaving the log open?",
    "options": [
      "Post the log",
      "Trigger charges",
      "Void the case",
      "Cancel the surgery"
    ],
    "correct": [
      1
    ],
    "rationale": "Triggering sends eligible charges while keeping the log open. Posting closes the log and later changes require an addendum."
  },
  {
    "id": "OR100-16",
    "course": "OR100",
    "topic": "Reporting",
    "pages": [
      152
    ],
    "prompt": "A team wants a custom list of last month’s logs missing incision closure documentation. Which reporting tool is the course’s best fit?",
    "options": [
      "Reporting Workbench",
      "A scheduling block",
      "An order set",
      "A preference card"
    ],
    "correct": [
      0
    ],

</script><script>(function(root){
const same=(a,b)=>a.length===b.length&&[...a].sort().every((v,i)=>v===[...b].sort()[i]);

function select(bank,course,count,rng=Math.random){const pool=bank.filter(q=>course==='all'||q.course===course);return shuffle(pool,rng).slice(0,Math.min(count,pool.length))}

</script><script>const BANK=window.QUESTION_BANK, C=QuizCore, KEY='optime-studio-v1', VERSION=1;
const main=document.querySelector('main');
const SOURCES={OR100:'OR100 OpTime Fundamentals (With Answers).pdf',OR350:'OR350 OpTime Administration (With Answers).pdf','CLN251-252':'CLN251-252 Configuring the Epic End User Clinical_Shared (With Answers).pdf'};
let memory={session:null,history:[]}, storageOK=true, view='home', filter='all';
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved?.version===VERSION){memory=saved;const s=memory.session;if(s&&(!Array.isArray(s.ids)||!s.ids.every(id=>BANK.some(q=>q.id===id))))memory.session=null}}catch{storageOK=false}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({...memory,version:VERSION}))}catch{storageOK=false;toast('Storage unavailable. Keep this tab open to retain your session.')}};
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',4200)}
function questions(){return memory.session.ids.map(id=>BANK.find(q=>q.id===id))}
function source(q){return `${esc(SOURCES[q.course])} · PDF ${q.pages.length===1?'p.':'pp.'} ${q.pages.join(', ')} · February 2026`}
function goFocus(){main.focus();window.scrollTo({top:0,behavior:'instant'})}
function setView(next){view=next;render();goFocus()}
function home(){
const s=memory.session,h=memory.history,avg=h.length?Math.round(h.reduce((a,x)=>a+x.pct,0)/h.length):null;
main.innerHTML=`${s&&!s.done?`<div class="banner"><div><strong>Your session is waiting</strong><p>${s.ids.length} questions · ${s.mode==='exam'?'Exam mode · timer continues':'Study mode'} · ${Object.values(s.answers).filter(a=>a.length).length} answered</p></div><button id="resume">Resume session →</button></div>`:''}
<section class="hero"><div><div class="eyebrow">YOUR NEXT STEP, WELL PREPARED</div><h1>Know the workflow.<br>Build your confidence.</h1><p>Make your OpTime knowledge stick with focused practice, realistic scenarios, and explanations you can trace back to the source.</p></div><div class="hero-art"><div class="eyebrow">A LITTLE PRACTICE, EVERY DAY</div><div class="large">60<span style="font-size:18px;letter-spacing:0"> questions</span></div><p>One place to connect workflow,<br>configuration, and administration.</p><div class="mini-stats"><span><strong>3</strong>courses</span><span><strong>${h.length}</strong>sessions</span><span><strong>${avg===null?'—':avg+'%'}</strong>average</span></div></div></section>
<div class="layout"><section class="card"><div class="card-top"><h2>Make this session yours</h2><span class="step">01 / SET UP</span></div><form id="setup"><div class="modes"><label class="mode"><input type="radio" name="mode" value="study" checked><strong>Study mode</strong><small>Take your time. Check each answer and learn the reasoning.</small></label><label class="mode"><input type="radio" name="mode" value="exam"><strong>Exam mode</strong><small>Stay focused. Review answers and rationales after submission.</small></label></div><div class="form-grid"><div class="form-field wide"><label for="course">Focus area</label><select id="course"><option value="all">All courses · mixed practice</option><option value="OR100">OR100 · Fundamentals</option><option value="CLN251-252">CLN251/252 · Configuration</option><option value="OR350">OR350 · Administration</option></select></div><div class="form-field"><label for="count">Questions</label><select id="count"><option value="10">10 · Quick practice</option><option value="20" selected>20 · Focused session</option><option value="40">40 · Extended session</option><option value="60">60 · Full question bank</option></select></div><div class="form-field"><label for="duration">Exam time limit</label><select id="duration" disabled><option value="30">30 minutes</option><option value="60">60 minutes</option><option value="120" selected>120 minutes</option></select></div></div><button class="start" type="submit"><span>Start practice</span><span aria-hidden="true">↗</span></button><p class="note" id="setup-note">Untimed practice. Questions and answer choices are shuffled each session.</p></form></section>
<aside><section class="card"><div class="eyebrow muted">YOUR STUDY MAP</div><div class="course-row"><span class="course-mark">01</span><div><strong>Fundamentals</strong><small>OR100 · The perioperative workflow</small></div><span class="course-count">16</span></div><div class="course-row"><span class="course-mark">02</span><div><strong>Configuration</strong><small>CLN251/252 · People, profiles & access</small></div><span class="course-count">20</span></div><div class="course-row"><span class="course-mark">03</span><div><strong>Administration</strong><small>OR350 · Build, charging & security</small></div><span class="course-count">24</span></div><p class="note">Original single-answer and select-all practice. Course mix, question count, and scoring are practice settings—not an official exam blueprint or passing standard.</p></section><section class="card history"><h3>Recent sessions</h3>${h.length?h.slice(0,4).map(x=>`<div class="history-row"><div>${esc(x.mode==='exam'?'Exam practice':'Study practice')}<br><small>${new Date(x.date).toLocaleDateString()} · ${x.total} questions</small></div><strong>${x.pct}%</strong></div>`).join(''):'<p class="empty">Your first session starts here. Results will be saved on this device.</p>'}${s?.done?'<button class="ghost" id="last-results">View latest results →</button>':''}</section></aside></div><p class="note">${storageOK?'Saved locally in this browser. Progress does not sync between devices.':'Browser storage is unavailable. Progress will last only while this page remains open.'} Exam mode submits automatically when time expires, including time spent away from this tab. Each question is one point; select-all questions require an exact match.</p>`;
document.querySelector('#resume')?.addEventListener('click',()=>setView('question'));
document.querySelector('#last-results')?.addEventListener('click',()=>setView('results'));
const setup=document.querySelector('#setup'), course=document.querySelector('#course'),count=document.querySelector('#count');
setup.addEventListener('change',()=>{const exam=setup.elements.mode.value==='exam';document.querySelector('#duration').disabled=!exam;document.querySelector('#setup-note').textContent=exam?'Timed simulation: flag questions, revisit answers, and submit when ready. Rationales appear only at the end.':'Untimed practice. Questions and answer choices are shuffled each session.';const max=BANK.filter(q=>course.value==='all'||q.course===course.value).length;for(const o of count.options){o.disabled=Number(o.value)>max}if(Number(count.value)>max)count.value='10'});
setup.addEventListener('submit',e=>{e.preventDefault();if(memory.session&&!memory.session.done){toast('Resume and finish your active session before starting another.');return}start(C.select(BANK,course.value,Number(count.value)),setup.elements.mode.value,Number(document.querySelector('#duration').value))});
}
function start(qs,mode='study',minutes=120){const now=Date.now();memory.session={ids:qs.map(q=>q.id),mode,index:0,answers:{},flags:[],checked:[],order:Object.fromEntries(qs.map(q=>[q.id,C.shuffle(q.options.map((_,i)=>i))])),started:now,deadline:mode==='exam'?now+minutes*60000:null,done:false};save();setView('question')}
function explanation(q,selected){const ok=C.same(selected,q.correct);return `<div class="feedback ${ok?'':'wrong'}" role="status"><h3>${ok?'Correct. Nicely reasoned.':'Let’s work through it.'}</h3><p><strong>Correct ${q.correct.length>1?'answers':'answer'}:</strong> ${q.correct.map(i=>esc(q.options[i])).join('; ')}</p><p>${esc(q.rationale)}</p><span class="source">${source(q)}</span></div>`}
function question(){const s=memory.session;if(!s)return setView('home');if(s.done)return setView('results');const qs=questions(),q=qs[s.index],chosen=s.answers[q.id]||[],checked=s.checked.includes(q.id),multi=q.correct.length>1,answered=qs.filter(q=>s.answers[q.id]?.length).length;
main.innerHTML=`<div class="session-head"><div><span class="eyebrow">${s.mode==='exam'?'EXAM SIMULATION':'LEARN AS YOU GO'}</span><h1>${s.mode==='exam'?'Focus on the next question.':'A little clearer, each question.'}</h1></div><div class="timer" id="timer"><small>${s.mode==='exam'?'TIME REMAINING':'YOUR PACE'}</small><span id="time-value">${s.mode==='exam'?'':'Untimed'}</span></div></div><div class="progress" aria-label="${answered} of ${qs.length} answered"><span style="width:${answered/qs.length*100}%"></span></div><div class="exam-layout"><section class="card question-card"><div class="q-meta"><span class="pill">${esc(q.course)}</span><span>${esc(q.topic)}</span><span style="margin-left:auto">${s.index+1} / ${qs.length}</span></div><h2 id="question-title">${esc(q.prompt)}</h2><p class="choice-hint">${multi?'Select all that apply. All correct choices are required.':'Choose one answer.'}</p><div class="options" role="group" aria-labelledby="question-title">${s.order[q.id].map((i,n)=>`<label class="option ${checked?(q.correct.includes(i)?'correct':chosen.includes(i)?'wrong':''):''}"><input type="${multi?'checkbox':'radio'}" name="answer" value="${i}" ${chosen.includes(i)?'checked':''} ${checked?'disabled':''}><span class="letter" aria-hidden="true">${String.fromCharCode(65+n)}</span><span class="option-text">${esc(q.options[i])}${checked&&q.correct.includes(i)?' <strong>✓ Correct</strong>':''}</span></label>`).join('')}</div>${checked?explanation(q,chosen):''}${s.mode==='study'&&!checked?`<button id="check" ${chosen.length?'':'disabled'}>Check answer</button>`:''}<div class="q-actions"><button class="ghost" id="flag" aria-pressed="${s.flags.includes(q.id)}">${s.flags.includes(q.id)?'★ Flagged for review':'☆ Flag for review'}</button><div class="actions"><button class="secondary" id="prev" ${s.index===0?'disabled':''}>← Previous</button><button id="next">${s.index===qs.length-1?'Finish session':'Next question →'}</button></div></div></section><aside class="card navigator"><h3>Question navigator</h3><small>${answered} of ${qs.length} answered</small><div class="nav-grid">${qs.map((x,i)=>`<button data-jump="${i}" class="${s.answers[x.id]?.length?'answered ':''}${i===s.index?'current ':''}${s.flags.includes(x.id)?'flagged':''}" aria-label="Question ${i+1}${s.answers[x.id]?.length?', answered':', unanswered'}${s.flags.includes(x.id)?', flagged':''}" ${i===s.index?'aria-current="step"':''}>${i+1}</button>`).join('')}</div><div class="legend">Green: answered · Outline: current<br>Gold dot: flagged for review</div><button class="secondary" id="submit">Finish & review</button><p class="save-note">${storageOK?'Progress saved automatically.':'Storage unavailable; keep this tab open.'}${s.mode==='exam'?' The timer continues if you leave.':''}</p></aside></div>`;
main.querySelectorAll('input[name=answer]').forEach(e=>e.addEventListener('change',()=>{s.answers[q.id]=[...main.querySelectorAll('input[name=answer]:checked')].map(e=>Number(e.value));save();if(s.mode==='study')document.querySelector('#check').disabled=!s.answers[q.id].length;const nav=main.querySelector(`[data-jump="${s.index}"]`);nav.classList.toggle('answered',s.answers[q.id].length>0);const num=qs.filter(x=>s.answers[x.id]?.length).length;document.querySelector('.navigator small').textContent=`${num} of ${qs.length} answered`;document.querySelector('.progress span').style.width=`${num/qs.length*100}%`;document.querySelector('.progress').setAttribute('aria-label',`${num} of ${qs.length} answered`)}));
document.querySelector('#check')?.addEventListener('click',()=>{s.checked.push(q.id);save();render()});
document.querySelector('#flag').onclick=()=>{s.flags=s.flags.includes(q.id)?s.flags.filter(id=>id!==q.id):[...s.flags,q.id];save();render();document.querySelector('#flag').focus()};
document.querySelector('#prev').onclick=()=>jump(s.index-1);document.querySelector('#next').onclick=()=>s.index===qs.length-1?askFinish():jump(s.index+1);document.querySelector('#submit').onclick=askFinish;main.querySelectorAll('[data-jump]').forEach(e=>e.onclick=()=>jump(Number(e.dataset.jump)));tick();
}
function jump(i){memory.session.index=i;save();render();goFocus()}
function askFinish(){const s=memory.session,n=s.ids.filter(id=>!s.answers[id]?.length).length;document.querySelector('#confirm-text').textContent=`${n?`${n} unanswered ${n===1?'question will':'questions will'} count as incorrect. `:''}${s.flags.length?`${s.flags.length} flagged for review. `:''}Submit to see your score, explanations, and source pages.`;document.querySelector('#confirm').showModal()}
function finish(expired=false){const s=memory.session;if(!s||s.done)return;s.done=true;s.finished=Date.now();s.expired=expired;const qs=questions(),correct=C.score(qs,s.answers);memory.history.unshift({date:s.finished,mode:s.mode,total:qs.length,correct,pct:Math.round(correct/qs.length*100)});memory.history=memory.history.slice(0,30);save();document.querySelector('#confirm').close();filter='all';setView('results');if(expired)toast('Time expired. Your saved answers were submitted.')}
function results(){const s=memory.session;if(!s?.done)return setView('home');const qs=questions(),score=C.score(qs,s.answers),pct=Math.round(score/qs.length*100),missed=qs.filter(q=>!C.same(s.answers[q.id]||[],q.correct)),answered=qs.filter(q=>s.answers[q.id]?.length).length;
main.innerHTML=`<section class="result-hero"><div class="score-ring" style="--score:${pct}%"><div class="score-inner"><strong>${pct}%</strong><small>PRACTICE SCORE</small></div></div><div><div class="eyebrow">SESSION COMPLETE${s.expired?' · TIME EXPIRED':''}</div><h1>${pct>=80?'Your practice is paying off.':'Every review is a step forward.'}</h1><p>${score} of ${qs.length} correct · ${qs.length-answered} unanswered<br>This is practice feedback, not an official passing result.</p></div></section><div class="breakdown">${['OR100','CLN251-252','OR350'].map(c=>{const group=qs.filter(q=>q.course===c),n=C.score(group,s.answers);return `<div class="card"><span class="eyebrow">${c}</span><strong>${group.length?Math.round(n/group.length*100)+'%':'—'}</strong><small>${group.length?`${n} of ${group.length} correct`:'Not in this session'}</small></div>`}).join('')}</div><div class="actions"><button id="retry" ${missed.length?'':'disabled'}>Practice missed questions (${missed.length})</button><button class="secondary" id="new-session">New session</button><button class="ghost" id="export">Download results</button></div><div class="results-tools"><h2 style="margin:0;font-size:24px">Understand every answer</h2><label><span class="sr-only">Review filter</span><select id="review-filter"><option value="all">All questions</option><option value="missed">Missed / unanswered</option><option value="flagged">Flagged questions</option></select></label></div><div id="review-list"></div>`;
document.querySelector('#review-filter').value=filter;document.querySelector('#review-filter').onchange=e=>{filter=e.target.value;reviewList()};document.querySelector('#new-session').onclick=()=>setView('home');document.querySelector('#retry').onclick=()=>start(C.shuffle(missed));document.querySelector('#export').onclick=()=>download(qs,s);reviewList();
}
function reviewList(){const s=memory.session,qs=questions();document.querySelector('#review-list').innerHTML=qs.map((q,n)=>({q,n,ok:C.same(s.answers[q.id]||[],q.correct)})).filter(({q,ok})=>filter==='all'||filter==='missed'&&!ok||filter==='flagged'&&s.flags.includes(q.id)).map(({q,n,ok})=>`<details class="card review-item"><summary><small>${q.course} · ${esc(q.topic)} · <span class="inline-status ${ok?'':'wrong'}">${ok?'CORRECT':s.answers[q.id]?.length?'INCORRECT':'UNANSWERED'}</span></small>${n+1}. ${esc(q.prompt)}</summary><div class="review-body"><ul>${s.order[q.id].map(i=>`<li class="${q.correct.includes(i)?'correct':s.answers[q.id]?.includes(i)?'wrong':''}">${q.correct.includes(i)?'✓ ':''}${esc(q.options[i])}${s.answers[q.id]?.includes(i)?' <strong>— Your choice</strong>':''}</li>`).join('')}</ul><p><strong>Why this answer:</strong> ${esc(q.rationale)}</p><span class="source">${source(q)}</span></div></details>`).join('')||'<p class="empty">No questions match this filter.</p>'}
function download(qs,s){const data={completed:new Date(s.finished).toISOString(),mode:s.mode,score:C.score(qs,s.answers),total:qs.length,questions:qs.map(q=>({id:q.id,topic:q.topic,prompt:q.prompt,yourAnswers:(s.answers[q.id]||[]).map(i=>q.options[i]),correctAnswers:q.correct.map(i=>q.options[i]),rationale:q.rationale,source:SOURCES[q.course],pdfPages:q.pages}))};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='optime-practice-results.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function tick(){const s=memory.session;if(!s||s.done||!s.deadline)return;const r=C.remaining(s.deadline);if(r===0){finish(true);return}if(view==='question'){const e=document.querySelector('#time-value');if(e)e.textContent=`${String(Math.floor(r/3600)).padStart(2,'0')}:${String(Math.floor(r%3600/60)).padStart(2,'0')}:${String(r%60).padStart(2,'0')}`;document.querySelector('#timer')?.classList.toggle('urgent',r<=300)}}
function render(){if(view==='home')home();else if(view==='question')question();else results()}
document.querySelector('#keep-working').onclick=()=>document.querySelector('#confirm').close();document.querySelector('#finish-now').onclick=()=>finish();document.querySelector('#home-btn').onclick=()=>setView('home');document.querySelector('#brand').onclick=e=>{e.preventDefault();setView('home')};document.addEventListener('visibilitychange',tick);window.addEventListener('focus',tick);setInterval(tick,1000);render();tick();
</script></body></html>
